<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SISTEMA INTEGRAL IMSS - UMF 40</title>
    <style>
        body { background-color: #d1d5db; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; }
        
        /* Barra superior */
        .header { background: #0b5e3a; color: white; padding: 10px 20px; font-weight: bold; border-bottom: 3px solid #f59e0b; }
        
        /* Layout */
        .wrapper { display: flex; height: 90vh; }
        .sidebar { width: 300px; background: #fff; overflow-y: auto; border-right: 1px solid #ccc; }
        .main { flex: 1; padding: 20px; }
        
        /* Estilo de paciente */
        .paciente { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; }
        .paciente:hover { background: #e5e7eb; }
        
        /* La "Hoja" (Modal) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
        .hoja-receta { background: white; width: 400px; padding: 30px; box-shadow: 0 0 10px #000; border: 1px solid #000; }
        .hoja-receta h2 { text-align: center; border-bottom: 2px solid #000; }
    </style>
</head>
<body>

<div class="header">IMSS DIGITAL - VENTANILLA DE ATENCIÓN MÉDICA - MATRÍCULA: 99382104</div>

<div class="wrapper">
    <div class="sidebar" id="listaPacientes">
        <!-- Los 100 pacientes se generan aquí -->
    </div>
    <div class="main" id="areaTrabajo">
        <h1>Selecciona un paciente del listado</h1>
    </div>
</div>

<!-- Ventana de la Hoja -->
<div class="modal" id="modalReceta">
    <div class="hoja-receta">
        <h2>RECETA INSTITUCIONAL</h2>
        <p><strong>Paciente:</strong> <span id="rNombre"></span></p>
        <p><strong>NSS:</strong> <span id="rNSS"></span></p>
        <p><strong>Prescripción:</strong> Paracetamol 500mg, 1 cada 8hrs.</p>
        <br><br>
        <p>__________________________<br>Firma del Médico (Clic aquí para firmar)</p>
        <button onclick="cerrarHoja()" style="width:100%; padding:10px; background:green; color:white; border:none; cursor:pointer;">PROCESAR Y FIRMAR</button>
    </div>
</div>

<script>
    const pacientes = [];
    const motivos = ["Dolor de espalda", "Gripe", "Incapacidad", "Revisión rutinaria", "Presión alta", "Tos crónica"];
    
    // Generar 100 pacientes
    for(let i=0; i<100; i++) {
        pacientes.push({
            id: i,
            nombre: "Paciente " + (i+1) + " García",
            nss: "1234-88-000" + i,
            motivo: motivos[i % motivos.length]
        });
    }

    // Renderizar
    const lista = document.getElementById('listaPacientes');
    pacientes.forEach(p => {
        const div = document.createElement('div');
        div.className = 'paciente';
        div.innerHTML = `<strong>${p.nombre}</strong><br><small>${p.nss}</small>`;
        div.onclick = () => abrirPaciente(p);
        lista.appendChild(div);
    });

    function abrirPaciente(p) {
        document.getElementById('areaTrabajo').innerHTML = `
            <h2>Expediente de ${p.nombre}</h2>
            <p><strong>NSS:</strong> ${p.nss}</p>
            <p><strong>Motivo:</strong> ${p.motivo}</p>
            <button onclick="abrirReceta('${p.nombre}', '${p.nss}')" style="padding:15px; font-size:16px;">Generar Receta (Abrir Hoja)</button>
        `;
    }

    function abrirReceta(n, nss) {
        document.getElementById('rNombre').innerText = n;
        document.getElementById('rNSS').innerText = nss;
        document.getElementById('modalReceta').style.display = 'flex';
    }

    function cerrarHoja() {
        alert("¡Receta procesada y firmada digitalmente! Se envió a la farmacia.");
        document.getElementById('modalReceta').style.display = 'none';
    }
</script>

</body>
</html>
