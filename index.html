<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMSS - CONSULTORIO PRO</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; display: flex; height: 100vh; }
        .sidebar { width: 300px; background: white; border-right: 2px solid #ddd; overflow-y: auto; }
        .main { flex: 1; display: flex; flex-direction: column; }
        .header { background: #0b5e3a; color: white; padding: 15px; font-weight: bold; }
        .chat-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .bubble { padding: 12px; border-radius: 15px; max-width: 80%; }
        .paciente { background: #e0e0e0; align-self: flex-start; }
        .medico { background: #0b5e3a; color: white; align-self: flex-end; }
        .input-box { padding: 20px; background: white; border-top: 1px solid #ccc; display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; background: #d97706; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="sidebar" id="lista"></div>
<div class="main">
    <div class="header" id="tituloChat">Selecciona un paciente para la consulta</div>
    <div class="chat-container" id="chat"></div>
    <div class="input-box">
        <input type="text" id="mensaje" placeholder="Escribe tu diagnóstico o pregunta...">
        <button onclick="enviar()">Enviar</button>
    </div>
</div>

<script>
    const pacientes = ["Doña Lupita", "Don Beto", "Brayan", "Kevin", "Sra. María"];
    const lista = document.getElementById('lista');
    let pacienteActual = null;
    let turnos = 0;

    pacientes.forEach(p => {
        const div = document.createElement('div');
        div.innerHTML = `<div style="padding:15px; border-bottom:1px solid #eee; cursor:pointer;">${p}</div>`;
        div.onclick = () => iniciarConsulta(p);
        lista.appendChild(div);
    });

    function iniciarConsulta(nombre) {
        pacienteActual = nombre;
        turnos = 0;
        document.getElementById('tituloChat').innerText = "Consulta con: " + nombre;
        document.getElementById('chat').innerHTML = `<div class="bubble paciente">Doctor, buenos días... fíjese que me siento muy mal.</div>`;
    }

    function enviar() {
        const input = document.getElementById('mensaje');
        const txt = input.value;
        if (!txt || !pacienteActual) return;
        
        // Mostrar mensaje del médico
        const chat = document.getElementById('chat');
        chat.innerHTML += `<div class="bubble medico">${txt}</div>`;
        input.value = '';
        
        turnos++;
        
        // Lógica de respuesta dramática
        setTimeout(() => {
            let respuesta = "";
            if (turnos === 1) respuesta = "Ay, pues es que me duele todo el cuerpo, doctor. ¿No cree que sea algo grave?";
            else if (turnos === 2) respuesta = "Sí, desde ayer en la noche... y aparte ando muy estresado por el trabajo, ¿usted cree que sea eso?";
            else if (turnos === 3) respuesta = "Nombre doctor, si yo trabajo un buen... ¿no me puede dar una incapacidad de unos 3 días al menos?";
            else respuesta = "Está bien doctor, usted es el que sabe. Muchas gracias, ya me voy porque me espera el camión.";
            
            chat.innerHTML += `<div class="bubble paciente">${respuesta}</div>`;
            chat.scrollTop = chat.scrollHeight;
        }, 1000);
    }
</script>
</body>
</html>
